# Shared configuration for the coding-agent harnesses installed on this
# machine: OpenCode, Claude Code and GitHub Copilot CLI. It configures those
# tools for the user; it is not guidance for an agent editing this repository.
#
# Nothing reads this file yet. The MCP servers are currently written into each
# harness's config by scripts/setup-mcp.sh, and the skills are linked by
# install.sh.
#
# Global instructions aren't configured here. If harness/user-instructions.md
# exists, install.sh links it to:
#   ~/.claude/CLAUDE.md                  (Claude Code, and OpenCode when
#                                         ~/.config/opencode/AGENTS.md is absent)
#   ~/.copilot/copilot-instructions.md   (Copilot CLI)
# and agent-dev gives it to its agent containers.
version: 1

# Folder of SKILL.md skills, relative to the repository root. Each skill is
# linked into ~/.claude/skills (read by Claude Code and OpenCode) and
# ~/.copilot/skills (read by Copilot CLI), and agent-dev mounts the folder into
# its agent containers.
skills: skills

mcp:
  # OpenCode: mcp.timeout.startup (ms). Claude Code: env.MCP_TIMEOUT in
  # settings.json (ms, default 30000). Copilot CLI: no equivalent.
  startup_timeout: 45s

  # setup-mcp fills in ${MCP_ROUTER} with the docker bridge IP.
  #   OpenCode:    mcp.servers.<name>: {type: remote, url}
  #   Claude Code: claude mcp add-json -s user <name> {type: http, url}
  #   Copilot CLI: mcpServers.<name>: {type: http, url, tools: ["*"]}
  servers:
    grafana:    { url: "http://${MCP_ROUTER}:8280/mcp" }
    kubernetes: { url: "http://${MCP_ROUTER}:8180/mcp" }
    gitea:      { url: "http://${MCP_ROUTER}:8380/mcp" }

# Settings for one harness only, merged as written into:
#   opencode: ~/.config/opencode/opencode.json
#   claude:   ~/.claude/settings.json
#   copilot:  ~/.copilot/settings.json
harness:
  opencode:
    theme: ayu-dark
  claude:
    theme: auto
  copilot: {}
