# MangoHud profile used by /usr/local/bin/game-performance (stutter-watch).
# Only applied when a game's launch options don't already configure MangoHud.
# Opt a single game out with launch options:  STUTTER_WATCH_MANGOHUD=0 game-performance %command%
# Toggle the HUD in-game: Shift_R+F12   (logging continues while hidden)

### Small, out-of-the-way layout
legacy_layout=0
hud_compact
position=top-left
font_size=16
background_alpha=0.35
round_corners=6

### Stutter-relevant metrics
fps
frametime
# Average and 1% low FPS: a 1% low far below the average means hitches.
fps_metrics=avg,0.01
# Frame-time graph: stutters show up as spikes.
frame_timing
cpu_stats
gpu_stats
ram
swap
throttling_status

### Per-frame log, read live by stutter-watch to detect stutters
output_folder=@FRAMETIMES@
autostart_log=1
log_interval=0
